[project]
name = "mindjax-knowledge-converter"
version = "1.0.0"
description = "Converts Word and PowerPoint files into clean, portable HTML."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
